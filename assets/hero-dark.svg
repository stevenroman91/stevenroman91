<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="title desc">
  <title id="title">Steven Roman — founder · builder</title>
  <desc id="desc">node --test steven.test.js: a pipeline from ticket to Claude Code session to branch, PR, CI and merge. About 1,700 merged PRs since May 2026, 34 ADRs, 6 products shipping.</desc>
  <style>
    .n{animation:on 5.4s ease-in-out infinite}
    @keyframes on{0%,6%{fill-opacity:0;stroke-opacity:.35}14%,82%{fill-opacity:1;stroke-opacity:1}94%,100%{fill-opacity:0;stroke-opacity:.35}}
    .n0{animation-delay:0.00s}.n1{animation-delay:0.45s}.n2{animation-delay:0.90s}.n3{animation-delay:1.35s}.n4{animation-delay:1.80s}.n5{animation-delay:2.25s}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion: reduce){.n,.cursor{animation:none}}
  </style>
  <rect x="1.5" y="1.5" width="1197" height="427" rx="22" fill="#0F1B3D" stroke="#24305A" stroke-width="3"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20">
    <circle cx="44" cy="40" r="7" fill="#FF6B6B" opacity=".85"/>
    <circle cx="68" cy="40" r="7" fill="#FFD23F"/>
    <circle cx="92" cy="40" r="7" fill="#4ADE80" opacity=".85"/>
    <text x="56" y="100" fill="#7B84FF">$ <tspan fill="#FFFFFF">node --test steven.test.js</tspan><tspan class="cursor" fill="#7B84FF"> ▍</tspan></text>
  </g>

  <text x="54" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="70" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Steven Roman</text>
  <text x="56" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#A9B1CC">founder <tspan fill="#FFD23F">·</tspan> builder</text>
  <text x="56" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#FFFFFF">Entrepreneur first. I build pro-ready products, fast,</text>
  <text x="56" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#FFFFFF">to test them fast, and to stop them just as fast.</text>

  <line x1="76" y1="352" x2="736" y2="352" stroke="#2C3866" stroke-width="3"/>
    <circle class="n n0" cx="76" cy="352" r="13" fill="#7B84FF" stroke="#7B84FF" stroke-width="3"/>
    <text x="76" y="392" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#A9B1CC">ticket</text>
    <circle class="n n1" cx="208" cy="352" r="13" fill="#FFD23F" stroke="#FFD23F" stroke-width="3"/>
    <text x="208" y="392" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#FFFFFF">session</text>
    <circle class="n n2" cx="340" cy="352" r="13" fill="#7B84FF" stroke="#7B84FF" stroke-width="3"/>
    <text x="340" y="392" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#A9B1CC">branch</text>
    <circle class="n n3" cx="472" cy="352" r="13" fill="#7B84FF" stroke="#7B84FF" stroke-width="3"/>
    <text x="472" y="392" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#A9B1CC">PR</text>
    <circle class="n n4" cx="604" cy="352" r="13" fill="#7B84FF" stroke="#7B84FF" stroke-width="3"/>
    <text x="604" y="392" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#A9B1CC">CI</text>
    <circle class="n n5" cx="736" cy="352" r="13" fill="#7B84FF" stroke="#7B84FF" stroke-width="3"/><path class="n n5" d="M730 352 l4 4 l8 -9" fill="none" stroke="#0F1B3D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="736" y="392" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#A9B1CC">merged</text>

  <line x1="812" y1="72" x2="812" y2="392" stroke="#24305A" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="856" y="140" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1">~1,700</text>
    <text x="858" y="170" font-size="18" fill="#A9B1CC">merged PRs since May 2026</text>
    <text x="856" y="250" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1">34</text>
    <text x="858" y="280" font-size="18" fill="#A9B1CC">ADRs — immutable, by design</text>
    <text x="856" y="360" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1">6</text>
    <text x="858" y="390" font-size="18" fill="#A9B1CC">products shipping</text>
  </g>
</svg>
